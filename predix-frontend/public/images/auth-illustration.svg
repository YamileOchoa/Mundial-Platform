<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" fill="none">

  <!-- Background glow rings -->
  <circle cx="310" cy="195" r="210" fill="rgba(255,255,255,0.03)"/>
  <circle cx="310" cy="195" r="148" fill="rgba(255,255,255,0.05)"/>
  <circle cx="310" cy="195" r="120" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="6 5"/>

  <!-- ── SOCCER BALL ────────────────────────────────────────────── -->
  <!-- Shadow -->
  <ellipse cx="318" cy="298" rx="82" ry="14" fill="rgba(0,0,0,0.18)"/>
  <!-- Ball body -->
  <circle cx="310" cy="192" r="98" fill="rgba(255,255,255,0.13)" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>

  <!-- Pentagon patches (classic ball pattern) -->
  <!-- Center pentagon -->
  <polygon points="310,165 289,179 297,202 323,202 331,179" fill="rgba(255,255,255,0.28)" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  <!-- Top-left pentagon -->
  <polygon points="272,148 251,160 254,184 276,191 292,177 288,154" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
  <!-- Top-right pentagon -->
  <polygon points="348,148 369,160 366,184 344,191 328,177 332,154" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
  <!-- Bottom-left pentagon -->
  <polygon points="268,210 246,224 250,248 272,254 290,241 286,216" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
  <!-- Bottom-right pentagon -->
  <polygon points="352,210 374,224 370,248 348,254 330,241 334,216" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
  <!-- Bottom-center pentagon -->
  <polygon points="293,228 297,252 310,260 323,252 327,228 310,218" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>

  <!-- ── PREDICTION CARD (top-left, floating) ──────────────────── -->
  <rect x="18" y="32" width="188" height="98" rx="14" fill="rgba(255,255,255,0.16)" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
  <!-- Label -->
  <text x="36" y="56" font-family="system-ui,-apple-system,sans-serif" font-size="9" font-weight="600" fill="rgba(255,255,255,0.52)" letter-spacing="1.2">PREDICCIÓN</text>
  <!-- Score -->
  <text x="36" y="90" font-family="system-ui,-apple-system,sans-serif" font-size="30" font-weight="800" fill="white" letter-spacing="-1">2 — 1</text>
  <!-- Teams -->
  <text x="36" y="112" font-family="system-ui,-apple-system,sans-serif" font-size="10.5" fill="rgba(255,255,255,0.52)">Argentina vs Brasil</text>
  <!-- Check badge -->
  <rect x="142" y="101" width="48" height="18" rx="9" fill="rgba(16,185,129,0.28)" stroke="rgba(16,185,129,0.55)" stroke-width="1"/>
  <!-- Checkmark path -->
  <polyline points="152,110 156,114 162,107" stroke="rgb(52,211,153)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="167" y="114" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" font-weight="600" fill="rgb(52,211,153)">Acierto</text>

  <!-- ── POINTS CARD (right, floating) ─────────────────────────── -->
  <rect x="368" y="48" width="96" height="82" rx="14" fill="rgba(255,255,255,0.16)" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
  <!-- Trophy icon (geometric) -->
  <rect x="401" y="62" width="30" height="4" rx="2" fill="rgba(255,255,255,0.55)"/>
  <path d="M404,66 Q396,78 402,88 L414,88 Q420,78 412,66 Z" fill="rgba(255,255,255,0.65)"/>
  <rect x="407" y="88" width="2" height="10" fill="rgba(255,255,255,0.55)"/>
  <rect x="403" y="98" width="10" height="4" rx="2" fill="rgba(255,255,255,0.55)"/>
  <!-- Trophy handles -->
  <path d="M404,68 Q398,72 400,80" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M412,68 Q418,72 416,80" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Points value -->
  <text x="416" y="120" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="800" fill="white" text-anchor="middle">+5</text>
  <text x="416" y="134" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="rgba(255,255,255,0.48)" text-anchor="middle">puntos</text>

  <!-- ── LEADERBOARD CARD (bottom-left, floating) ───────────────── -->
  <rect x="16" y="255" width="208" height="90" rx="14" fill="rgba(255,255,255,0.16)" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
  <!-- Header -->
  <text x="36" y="278" font-family="system-ui,-apple-system,sans-serif" font-size="9" font-weight="600" fill="rgba(255,255,255,0.52)" letter-spacing="1.2">CLASIFICACIÓN</text>
  <!-- Rank 1 -->
  <rect x="36" y="286" width="5" height="18" rx="2.5" fill="rgba(217,119,6,0.9)"/>
  <text x="47" y="299" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" font-weight="600" fill="white">Juan</text>
  <text x="206" y="299" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" font-weight="700" fill="rgba(255,255,255,0.85)" text-anchor="end">87 pts</text>
  <!-- Rank 2 -->
  <rect x="36" y="308" width="5" height="18" rx="2.5" fill="rgba(148,163,184,0.7)"/>
  <text x="47" y="321" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="rgba(255,255,255,0.65)">María</text>
  <text x="206" y="321" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="rgba(255,255,255,0.55)" text-anchor="end">72 pts</text>
  <!-- Rank 3 -->
  <rect x="36" y="330" width="5" height="15" rx="2.5" fill="rgba(120,53,15,0.7)"/>
  <text x="47" y="341" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="rgba(255,255,255,0.45)">Carlos</text>
  <text x="206" y="341" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="rgba(255,255,255,0.4)" text-anchor="end">58 pts</text>

  <!-- ── MINI STAT PILL (floating bottom-right) ─────────────────── -->
  <rect x="362" y="278" width="104" height="36" rx="18" fill="rgba(255,255,255,0.16)" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
  <!-- Flame-like shape for "racha" -->
  <path d="M378,296 Q378,288 384,288 Q382,293 386,293 Q384,286 390,284 Q388,292 392,294 Q394,288 396,290 Q396,302 388,304 Q380,304 378,296 Z" fill="rgba(251,146,60,0.85)"/>
  <text x="400" y="301" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="white">Racha x5</text>

  <!-- ── DECORATIVE SPARKLES ─────────────────────────────────────── -->
  <!-- Large sparkle (top right area) -->
  <g transform="translate(448,26)" stroke="rgba(255,255,255,0.6)" stroke-linecap="round">
    <line x1="0" y1="-13" x2="0" y2="13" stroke-width="2.5"/>
    <line x1="-13" y1="0" x2="13" y2="0" stroke-width="2.5"/>
    <line x1="-9" y1="-9" x2="9" y2="9" stroke-width="1.5"/>
    <line x1="9" y1="-9" x2="-9" y2="9" stroke-width="1.5"/>
  </g>
  <!-- Medium sparkle (left) -->
  <g transform="translate(12,178)" stroke="rgba(255,255,255,0.38)" stroke-linecap="round">
    <line x1="0" y1="-9" x2="0" y2="9" stroke-width="2"/>
    <line x1="-9" y1="0" x2="9" y2="0" stroke-width="2"/>
    <line x1="-6" y1="-6" x2="6" y2="6" stroke-width="1.2"/>
    <line x1="6" y1="-6" x2="-6" y2="6" stroke-width="1.2"/>
  </g>
  <!-- Small sparkle (above ball) -->
  <g transform="translate(264,78)" stroke="rgba(255,255,255,0.42)" stroke-linecap="round">
    <line x1="0" y1="-7" x2="0" y2="7" stroke-width="1.8"/>
    <line x1="-7" y1="0" x2="7" y2="0" stroke-width="1.8"/>
  </g>
  <!-- Tiny sparkle (bottom right) -->
  <g transform="translate(456,240)" stroke="rgba(255,255,255,0.35)" stroke-linecap="round">
    <line x1="0" y1="-5" x2="0" y2="5" stroke-width="1.5"/>
    <line x1="-5" y1="0" x2="5" y2="0" stroke-width="1.5"/>
  </g>

  <!-- ── FLOATING DOTS ───────────────────────────────────────────── -->
  <circle cx="230" cy="24" r="4" fill="rgba(255,255,255,0.28)"/>
  <circle cx="248" cy="18" r="2.5" fill="rgba(255,255,255,0.18)"/>
  <circle cx="170" cy="14" r="2" fill="rgba(255,255,255,0.18)"/>
  <circle cx="424" cy="158" r="4.5" fill="rgba(255,255,255,0.18)"/>
  <circle cx="458" cy="195" r="3" fill="rgba(255,255,255,0.22)"/>
  <circle cx="420" cy="265" r="3.5" fill="rgba(255,255,255,0.15)"/>
  <circle cx="22" cy="52" r="3" fill="rgba(255,255,255,0.18)"/>
  <circle cx="348" cy="22" r="2.5" fill="rgba(255,255,255,0.22)"/>
  <circle cx="460" cy="310" r="2" fill="rgba(255,255,255,0.2)"/>

</svg>
